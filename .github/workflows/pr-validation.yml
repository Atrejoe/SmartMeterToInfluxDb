name: PR Validation

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The project targets netcoreapp2.1, whose SDK only ships as an old
      # container image. That image's glibc is too old for the Node runtime
      # GitHub's JavaScript actions (checkout, test-reporter, upload-artifact)
      # now require, so those actions run on the host and only the dotnet
      # commands run inside the container.
      #
      # `dotnet test` on the test project transitively restores and builds the
      # referenced main project, so a single command covers restore + build +
      # test. (The .sln references docker-compose.dcproj, which the dotnet CLI
      # cannot build on Linux, so the solution itself is never built.)
      - name: Build & test (.NET Core 2.1 container)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/src \
            -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=true \
            -e DOTNET_SKIP_FIRST_TIME_EXPERIENCE=true \
            -e DOTNET_NOLOGO=true \
            mcr.microsoft.com/dotnet/core/sdk:2.1 \
            dotnet test SmartMeterToInfluxDb.Tests/SmartMeterToInfluxDb.Tests.csproj \
              --configuration Release \
              --logger "trx;LogFileName=test-results.trx" \
              --results-directory ./TestResults

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Test Report
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
