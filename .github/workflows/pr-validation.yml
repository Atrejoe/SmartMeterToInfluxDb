name: PR Validation

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # `dotnet test` on the test project transitively restores and builds the
      # referenced main project, so a single command covers restore + build +
      # test. (The .sln references docker-compose.dcproj, which the dotnet CLI
      # cannot build on Linux, so the solution itself is never built.)
      - name: Build & test
        run: |
          dotnet test SmartMeterToInfluxDb.Tests/SmartMeterToInfluxDb.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./TestResults

      - name: Publish test report
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Test Report
          path: '**/TestResults/*.trx'
          reporter: dotnet-trx
          # Publish as a check run on the PR (visible in the Checks tab)
          # instead of only writing to the Actions run summary page.
          use-actions-summary: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
